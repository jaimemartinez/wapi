syntax = "proto2";

// Subconjunto del esquema WAProto de WhatsApp, lo justo para: handshake Noise,
// ClientPayload de login/registro, props del dispositivo y mensaje de texto.
// Los números de campo son los del protocolo real (estables). Amplíalo con el
// .proto canónico cuando necesites media, grupos, recibos, etc.

// ---------- Handshake ----------
message HandshakeMessage {
  message ClientHello {
    optional bytes ephemeral = 1;
    optional bytes static = 2;
    optional bytes payload = 3;
  }
  message ServerHello {
    optional bytes ephemeral = 1;
    optional bytes static = 2;
    optional bytes payload = 3;
  }
  message ClientFinish {
    optional bytes static = 1;
    optional bytes payload = 2;
  }
  optional ClientHello client_hello = 2;
  optional ServerHello server_hello = 3;
  optional ClientFinish client_finish = 4;
}

// ---------- Certificado Noise (verificación del servidor) ----------
message NoiseCertificate {
  message Details {
    optional uint32 serial = 1;
    optional uint32 issuer_serial = 2;
    optional bytes key = 3;
    optional uint64 not_before = 4;
    optional uint64 not_after = 5;
  }
  optional bytes details = 1;
  optional bytes signature = 2;
}

message CertChain {
  message NoiseCertificate {
    message Details {
      optional uint32 serial = 1;
      optional uint32 issuer_serial = 2;
      optional bytes key = 3;
      optional uint64 not_before = 4;
      optional uint64 not_after = 5;
    }
    optional bytes details = 1;
    optional bytes signature = 2;
  }
  optional NoiseCertificate leaf = 1;
  optional NoiseCertificate intermediate = 2;
}

// ---------- ClientPayload (login / registro) ----------
message ClientPayload {
  message UserAgent {
    enum Platform { ANDROID = 0; IOS = 1; WINDOWS = 2; WEB = 14; }
    message AppVersion {
      optional uint32 primary = 1;
      optional uint32 secondary = 2;
      optional uint32 tertiary = 3;
      optional uint32 quaternary = 4;
      optional uint32 quinary = 5;
    }
    enum ReleaseChannel { RELEASE = 0; BETA = 1; ALPHA = 2; DEBUG = 3; }
    optional Platform platform = 1;
    optional AppVersion app_version = 2;
    optional string mcc = 3;
    optional string mnc = 4;
    optional string os_version = 5;
    optional string manufacturer = 6;
    optional string device = 7;
    optional string os_build_number = 8;
    optional string phone_id = 9;
    optional ReleaseChannel release_channel = 10;
    optional string locale_language_iso_639_1 = 11;
    optional string locale_country_iso_3166_1_alpha_2 = 12;
    optional string device_board = 13;
  }

  message WebInfo {
    enum WebSubPlatform { WEB_BROWSER = 0; APP_STORE = 1; WIN_STORE = 2; DARWIN = 3; WIN32 = 4; }
    optional string ref_token = 1;
    optional string version = 2;
    optional WebSubPlatform web_sub_platform = 4;
  }

  message DevicePairingRegistrationData {
    optional bytes e_regid = 1;
    optional bytes e_keytype = 2;
    optional bytes e_ident = 3;
    optional bytes e_skey_id = 4;
    optional bytes e_skey_val = 5;
    optional bytes e_skey_sig = 6;
    optional bytes build_hash = 7;
    optional bytes device_props = 8;
  }

  enum ConnectType { CELLULAR_UNKNOWN = 0; WIFI_UNKNOWN = 1; }
  enum ConnectReason { PUSH = 0; USER_ACTIVATED = 1; SCHEDULED = 2; ERROR_RECONNECT = 3; NETWORK_SWITCH = 4; PING_RECONNECT = 5; }

  optional uint64 username = 1;
  optional bool passive = 3;
  optional UserAgent user_agent = 5;
  optional WebInfo web_info = 6;
  optional string push_name = 7;
  optional sfixed32 session_id = 9;
  optional bool short_connect = 10;
  optional ConnectType connect_type = 12;
  optional ConnectReason connect_reason = 13;
  optional uint32 device = 18;
  optional DevicePairingRegistrationData device_pairing_data = 19;
}

// Props del dispositivo (se serializa dentro de device_props).
message DeviceProps {
  message AppVersion {
    optional uint32 primary = 1;
    optional uint32 secondary = 2;
    optional uint32 tertiary = 3;
  }
  enum PlatformType { UNKNOWN = 0; CHROME = 1; FIREFOX = 2; IE = 3; OPERA = 4; SAFARI = 5; EDGE = 6; DESKTOP = 7; }
  optional string os = 1;
  optional AppVersion version = 2;
  optional PlatformType platform_type = 3;
  optional bool require_full_sync = 4;
}

// ---------- ADV (Advanced Device): emparejamiento ----------
// La identidad firmada del dispositivo que el teléfono produce al escanear el QR.
message ADVSignedDeviceIdentityHMAC {
  optional bytes details = 1;
  optional bytes hmac = 2;
}

message ADVSignedDeviceIdentity {
  optional bytes details = 1;
  optional bytes account_signature_key = 2;
  optional bytes account_signature = 3;
  optional bytes device_signature = 4;
}

message ADVDeviceIdentity {
  optional uint32 raw_id = 1;
  optional uint64 timestamp = 2;
  optional uint32 key_index = 3;
  optional uint32 account_type = 4; // ADVEncryptionType
  optional uint32 device_type = 5;
}

// ---------- Mensaje ----------
message Message {
  optional string conversation = 1;
  optional SenderKeyDistributionMessage sender_key_distribution_message = 2;
  optional ImageMessage image_message = 3;
  optional ContactMessage contact_message = 4;
  optional LocationMessage location_message = 5;
  optional ExtendedTextMessage extended_text_message = 6;
  optional DocumentMessage document_message = 7;
  optional AudioMessage audio_message = 8;
  optional VideoMessage video_message = 9;
  optional ProtocolMessage protocol_message = 12;
  optional ContactsArrayMessage contacts_array_message = 13;
  optional LiveLocationMessage live_location_message = 18;
  optional StickerMessage sticker_message = 26;
  optional DeviceSentMessage device_sent_message = 31;
  optional MessageContextInfo message_context_info = 35;
  optional FutureProofMessage view_once_message = 37;
  optional FutureProofMessage ephemeral_message = 40;
  optional ReactionMessage reaction_message = 46;
  optional PollCreationMessage poll_creation_message = 49;
  optional PollUpdateMessage poll_update_message = 50;
  optional FutureProofMessage view_once_message_v2 = 55;
  optional PollCreationMessage poll_creation_message_v2 = 60;
  optional PollCreationMessage poll_creation_message_v3 = 64;
}

// Contexto compartido por casi todos los tipos: cita, menciones, expiración.
message ContextInfo {
  optional string stanza_id = 1;
  optional string participant = 2;
  optional Message quoted_message = 3;
  optional string remote_jid = 4;
  repeated string mentioned_jid = 15;
  optional uint32 forwarding_score = 21;
  optional bool is_forwarded = 22;
  optional uint32 expiration = 25;
  optional int64 ephemeral_setting_timestamp = 26;
}

message MessageKey {
  optional string remote_jid = 1;
  optional bool from_me = 2;
  optional string id = 3;
  optional string participant = 4;
}

message ReactionMessage {
  optional MessageKey key = 1;
  optional string text = 2;
  optional string grouping_key = 3;
  optional int64 sender_timestamp_ms = 4;
}

message ExtendedTextMessage {
  optional string text = 1;
  optional string matched_text = 2;
  optional string canonical_url = 4;
  optional string description = 5;
  optional string title = 6;
  optional int32 preview_type = 10;
  optional bytes jpeg_thumbnail = 16;
  optional ContextInfo context_info = 17;
}

message LocationMessage {
  optional double degrees_latitude = 1;
  optional double degrees_longitude = 2;
  optional string name = 3;
  optional string address = 4;
  optional string url = 5;
  optional bool is_live = 6;
  optional uint32 accuracy_in_meters = 7;
  optional float speed_in_mps = 8;
  optional uint32 degrees_clockwise_from_magnetic_north = 9;
  optional string comment = 11;
  optional bytes jpeg_thumbnail = 16;
  optional ContextInfo context_info = 17;
}

message LiveLocationMessage {
  optional double degrees_latitude = 1;
  optional double degrees_longitude = 2;
  optional uint32 accuracy_in_meters = 3;
  optional float speed_in_mps = 4;
  optional uint32 degrees_clockwise_from_magnetic_north = 5;
  optional string caption = 6;
  optional int64 sequence_number = 7;
  optional uint32 time_offset = 8;
  optional bytes jpeg_thumbnail = 16;
  optional ContextInfo context_info = 17;
}

message ContactMessage {
  optional string display_name = 1;
  optional string vcard = 16;
  optional ContextInfo context_info = 17;
}

message ContactsArrayMessage {
  optional string display_name = 1;
  repeated ContactMessage contacts = 2;
  optional ContextInfo context_info = 17;
}

message PollCreationMessage {
  optional bytes enc_key = 1;
  optional string name = 2;
  repeated PollOption options = 3;
  optional uint32 selectable_options_count = 4;
  optional ContextInfo context_info = 5;
}
message PollOption {
  optional string option_name = 1;
  optional bytes option_hash = 2;
}

message PollUpdateMessage {
  optional MessageKey poll_creation_message_key = 1;
  optional PollEncValue vote = 2;
  optional int64 sender_timestamp_ms = 4;
}
message PollEncValue {
  optional bytes enc_payload = 1;
  optional bytes enc_iv = 2;
}
message PollVoteMessage {
  repeated bytes selected_options = 1;
}

message MessageContextInfo {
  optional bytes message_secret = 3;
}

message FutureProofMessage {
  optional Message message = 1;
}

// SKDM envuelta en Message (la que se manda 1:1 a cada participante de grupo).
message SenderKeyDistributionMessage {
  optional string group_id = 1;
  optional bytes axolotl_sender_key_distribution_message = 2;
}

// ---------- Mensajes de media (subconjuntos: subida + descarga) ----------
message ImageMessage {
  optional string url = 1;
  optional string mimetype = 2;
  optional string caption = 3;
  optional bytes file_sha256 = 4;
  optional uint64 file_length = 5;
  optional uint32 height = 6;
  optional uint32 width = 7;
  optional bytes media_key = 8;
  optional bytes file_enc_sha256 = 9;
  optional string direct_path = 11;
  optional int64 media_key_timestamp = 12;
  optional bytes jpeg_thumbnail = 16;
}

message VideoMessage {
  optional string url = 1;
  optional string mimetype = 2;
  optional bytes file_sha256 = 3;
  optional uint64 file_length = 4;
  optional uint32 seconds = 5;
  optional bytes media_key = 6;
  optional string caption = 7;
  optional bool gif_playback = 8;
  optional uint32 height = 9;
  optional uint32 width = 10;
  optional bytes file_enc_sha256 = 11;
  optional string direct_path = 13;
  optional int64 media_key_timestamp = 14;
  optional bytes jpeg_thumbnail = 16;
}

message AudioMessage {
  optional string url = 1;
  optional string mimetype = 2;
  optional bytes file_sha256 = 3;
  optional uint64 file_length = 4;
  optional uint32 seconds = 5;
  optional bool ptt = 6;
  optional bytes media_key = 7;
  optional bytes file_enc_sha256 = 8;
  optional string direct_path = 9;
  optional int64 media_key_timestamp = 10;
}

message DocumentMessage {
  optional string url = 1;
  optional string mimetype = 2;
  optional string title = 3;
  optional bytes file_sha256 = 4;
  optional uint64 file_length = 5;
  optional uint32 page_count = 6;
  optional bytes media_key = 7;
  optional string file_name = 8;
  optional bytes file_enc_sha256 = 9;
  optional string direct_path = 10;
  optional int64 media_key_timestamp = 11;
  optional bytes jpeg_thumbnail = 16;
  optional string caption = 20;
}

// OJO: en StickerMessage media_key=4 y mimetype=5 (orden distinto al resto).
message StickerMessage {
  optional string url = 1;
  optional bytes file_sha256 = 2;
  optional bytes file_enc_sha256 = 3;
  optional bytes media_key = 4;
  optional string mimetype = 5;
  optional uint32 height = 6;
  optional uint32 width = 7;
  optional string direct_path = 8;
  optional uint64 file_length = 9;
  optional int64 media_key_timestamp = 10;
  optional bool is_animated = 13;
  optional bytes png_thumbnail = 16;
}

// Copia que se manda a los OTROS dispositivos propios para que el mensaje
// también aparezca en tu teléfono ("device sent message").
message DeviceSentMessage {
  optional string destination_jid = 1;
  optional Message message = 2;
  optional string phash = 3;
}

// Mensaje de protocolo: aquí viaja la notificación de history sync (el volcado
// de chats que el teléfono envía al vincular un dispositivo nuevo).
// type: REVOKE=0, MESSAGE_EDIT=14, APP_STATE_SYNC_KEY_SHARE=6, HISTORY_SYNC_NOTIFICATION=2.
message ProtocolMessage {
  optional MessageKey key = 1;
  optional uint32 type = 2;
  optional HistorySyncNotification history_sync_notification = 6;
  optional AppStateSyncKeyShare app_state_sync_key_share = 7;
  optional Message edited_message = 14;
  optional int64 timestamp_ms = 15;
}

// ---------- App State Sync keys (compartición) ----------
message AppStateSyncKeyId { optional bytes key_id = 1; }
message AppStateSyncKeyFingerprint { optional uint32 raw_id = 1; optional uint32 current_index = 2; repeated uint32 device_indexes = 3 [packed = true]; }
message AppStateSyncKeyData { optional bytes key_data = 1; optional AppStateSyncKeyFingerprint fingerprint = 2; optional int64 timestamp = 3; }
message AppStateSyncKey { optional AppStateSyncKeyId key_id = 1; optional AppStateSyncKeyData key_data = 2; }
message AppStateSyncKeyShare { repeated AppStateSyncKey keys = 1; }

// ---------- App State Sync (SyncdPatch / mutaciones) ----------
message KeyId { optional bytes id = 1; }
message SyncdVersion { optional uint64 version = 1; }
message SyncdIndex { optional bytes blob = 1; }
message SyncdValue { optional bytes blob = 1; }
message SyncdRecord { optional SyncdIndex index = 1; optional SyncdValue value = 2; optional KeyId key_id = 3; }
message SyncdMutation { optional uint32 operation = 1; optional SyncdRecord record = 2; } // SET=0, REMOVE=1
message SyncdMutations { repeated SyncdMutation mutations = 1; }
message ExternalBlobReference {
  optional bytes media_key = 1; optional string direct_path = 2; optional string handle = 3;
  optional uint64 file_size_bytes = 4; optional bytes file_sha256 = 5; optional bytes file_enc_sha256 = 6;
}
message SyncdPatch {
  optional SyncdVersion version = 1;
  repeated SyncdMutation mutations = 2;
  optional ExternalBlobReference external_mutations = 3;
  optional bytes snapshot_mac = 4;
  optional bytes patch_mac = 5;
  optional KeyId key_id = 6;
}
message SyncdSnapshot {
  optional SyncdVersion version = 1;
  repeated SyncdRecord records = 2;
  optional bytes mac = 3;
  optional KeyId key_id = 4;
}

message SyncActionData {
  optional bytes index = 1;
  optional SyncActionValue value = 2;
  optional bytes padding = 3;
  optional int32 version = 4;
}
message SyncActionValue {
  optional int64 timestamp = 1;
  optional StarAction star_action = 2;
  optional MuteAction mute_action = 4;
  optional PinAction pin_action = 5;
  optional ArchiveChatAction archive_chat_action = 17;
  optional DeleteMessageForMeAction delete_message_for_me_action = 18;
  optional MarkChatAsReadAction mark_chat_as_read_action = 20;
  optional DeleteChatAction delete_chat_action = 22;
}
message StarAction { optional bool starred = 1; }
message MuteAction { optional bool muted = 1; optional int64 mute_end_timestamp = 2; }
message PinAction { optional bool pinned = 1; }
message ArchiveChatAction { optional bool archived = 1; optional SyncActionMessageRange message_range = 2; }
message MarkChatAsReadAction { optional bool read = 1; optional SyncActionMessageRange message_range = 2; }
message DeleteChatAction { optional SyncActionMessageRange message_range = 1; }
message DeleteMessageForMeAction { optional bool delete_media = 1; optional int64 message_timestamp = 2; }
message SyncActionMessageRange {
  optional int64 last_message_timestamp = 1;
  optional int64 last_system_message_timestamp = 2;
  repeated SyncActionMessage messages = 3;
}
message SyncActionMessage { optional MessageKey key = 1; optional int64 timestamp = 2; }

message HistorySyncNotification {
  optional bytes file_sha256 = 1;
  optional uint64 file_length = 2;
  optional bytes media_key = 3;
  optional bytes file_enc_sha256 = 4;
  optional string direct_path = 5;
  optional uint32 sync_type = 6;
  optional uint32 chunk_order = 7;
}

// ---------- History Sync (volcado descargado y descifrado) ----------
message HistorySync {
  optional uint32 sync_type = 1;
  repeated Conversation conversations = 2;
  repeated Pushname pushnames = 7;
}

// Subconjunto de Conversation: lo necesario para listar chats. protobufjs
// ignora los demás campos al decodificar.
message Conversation {
  optional string id = 1;
  optional uint64 last_msg_timestamp = 5;
  optional uint32 unread_count = 6;
  optional uint64 conversation_timestamp = 12;
  optional string name = 13;
  optional bool archived = 16;
}

message Pushname {
  optional string id = 1;
  optional string pushname = 2;
}
